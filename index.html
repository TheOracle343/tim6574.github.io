<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pico W Serial Console</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }
        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            background: #1e1e1e;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
        }
        select, input, button {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            cursor: pointer;
            font-weight: bold;
            background-color: #00a86b;
            border: none;
        }
        button:hover { background-color: #008f5a; }
        button:disabled {
            background-color: #333;
            color: #777;
            cursor: not-allowed;
        }
        #disconnectBtn { background-color: #cf6679; }
        #disconnectBtn:hover { background-color: #b13c50; }
        #console {
            background-color: #050505;
            border: 1px solid #333;
            height: 450px;
            overflow-y: auto;
            padding: 15px;
            font-family: "Fira Code", "Courier New", Courier, monospace;
            font-size: 14px;
            white-space: pre-wrap;
            box-sizing: border-box;
            border-radius: 6px;
            margin-bottom: 15px;
            color: #00ff66;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        .input-area input { flex-grow: 1; background: #1e1e1e; border-color: #444; }
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #cf6679;
        }
        .status-dot.connected { background-color: #00a86b; }
    </style>
</head>
<body>

<div class="container">
    <h2>Raspberry Pi Pico W Serial Console</h2>
    
    <div class="toolbar">
        <label for="baudrate">Baud Rate:</label>
        <select id="baudrate">
            <option value="115200" selected>115200 (Pico Default)</option>
            <option value="9600">9600</option>
        </select>

        <label for="lineEnding">Line Ending:</label>
        <select id="lineEnding">
            <option value="\r\n" selected>CRLF (\r\n)</option>
            <option value="\n">LF (\n)</option>
            <option value="\r">CR (\r)</option>
            <option value="">None</option>
        </select>

        <button id="connectBtn">Connect</button>
        <button id="disconnectBtn" disabled>Disconnect</button>
        
        <div class="status">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">Disconnected</span>
        </div>
    </div>

    <div id="console"></div>

    <div class="input-area">
        <input type="text" id="cmdInput" placeholder="Type microphython command or input here..." disabled />
        <button id="sendBtn" disabled>Send</button>
        <button id="clearBtn">Clear</button>
    </div>
</div>

<script>
    let port;
    let reader;
    const consoleDiv = document.getElementById('console');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');
    const cmdInput = document.getElementById('cmdInput');
    const baudrateSelect = document.getElementById('baudrate');
    const lineEndingSelect = document.getElementById('lineEnding');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    function logToConsole(text) {
        consoleDiv.textContent += text;
        consoleDiv.scrollTop = consoleDiv.scrollHeight; 
    }

    function updateUI(connected) {
        connectBtn.disabled = connected;
        baudrateSelect.disabled = connected;
        disconnectBtn.disabled = !connected;
        cmdInput.disabled = !connected;
        sendBtn.disabled = !connected;
        
        if (connected) {
            statusDot.classList.add('connected');
            statusText.textContent = "Connected";
            cmdInput.focus();
        } else {
            statusDot.classList.remove('connected');
            statusText.textContent = "Disconnected";
        }
    }

    async function readFromPort() {
        try {
            while (port.readable) {
                reader = port.readable.getReader();
                const decoder = new TextDecoder();
                try {
                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        if (value) {
                            logToConsole(decoder.decode(value));
                        }
                    }
                } catch (error) {
                    console.error("Read error:", error);
                } finally {
                    reader.releaseLock();
                }
            }
        } catch (error) {
            console.error("Exit stream loop:", error);
        }
    }

    connectBtn.addEventListener('click', async () => {
        if (!('serial' in navigator)) {
            alert('Web Serial API not supported! Ensure you are using Google Chrome or Microsoft Edge.');
            return;
        }

        try {
            port = await navigator.serial.requestPort();
            const baudRate = parseInt(baudrateSelect.value);
            // standard configurations for Pico hardware bridges
            await port.open({ baudRate, dataBits: 8, stopBits: 1, parity: "none", flowControl: "none" });
            
            updateUI(true);
            readFromPort();
        } catch (err) {
            console.error(err);
            alert('Could not connect. Ensure your IDE (like Thonny) is completely closed so it releases the COM port.');
        }
    });

    async function disconnect() {
        if (reader) {
            await reader.cancel();
        }
        if (port) {
            await port.close();
        }
        updateUI(false);
    }

    disconnectBtn.addEventListener('click', disconnect);

    async function sendData() {
        const text = cmdInput.value;
        if (!port || !port.writable) return;

        let ending = lineEndingSelect.value;
        // Parse literal string translations 
        if (ending === "\\r\\n") ending = "\r\n";
        if (ending === "\\n") ending = "\n";
        if (ending === "\\r") ending = "\r";

        const encoder = new TextEncoder();
        const data = encoder.encode(text + ending); 
        
        const writer = port.writable.getWriter();
        await writer.write(data);
        writer.releaseLock();
        
        cmdInput.value = '';
    }

    sendBtn.addEventListener('click', sendData);
    cmdInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendData(); });
    clearBtn.addEventListener('click', () => { consoleDiv.textContent = ''; });
</script>

</body>
</html>
